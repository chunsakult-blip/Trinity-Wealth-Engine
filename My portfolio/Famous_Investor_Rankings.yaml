portfolio_name: "Famous Investor Rank Screen"
last_updated: "2026-08-19"
framework:
  core:
    description: "High-quality, durable, low-noise compounding businesses with structural moats and cash generation"
    tickers: [MSFT, AMZN, GOOGL, AAPL, V, JPM, COST, XOM]
  satellite:
    description: "Higher-beta or thematic names with strong upside but more volatility and execution risk"
    tickers: [NVDA, META, TSM, UBER, NRG, OXY]
  avoid:
    description: "Speculative or operationally fragile names that should not be treated as core holdings"
    tickers: [CRWV]

